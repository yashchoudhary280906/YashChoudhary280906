<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <div>
            <button id= "light-btn" class= "toggle-btn" onclick="setLightMode()">
                 Light
            </button>
            <button id="dark-btn" class= "toggle-btn" onclick="setDarkMode()">
                 Dark
            </button>
        </div>

        <div class="profile-card">
            <img src="light.jpg" alt="Profile Picture" id="profile-pic" class="avatar">
            
            <h2 class="student-name">Yash Choudhary</h2>
            
            <p class="bio">
                Im passionate about doing web development.</p>
            <a href class="contact-btn">
                <img alt="Email">
                <span>Get in touch</span>
            </a>

            <div class="social-links">
                <a href="#" class="social-icon">
                    <img src="icons/tiktok.png" alt="TikTok">
                </a>
                <a href="#" class="social-icon">
                    <img src="icons/instagram.png" alt="Instagram">
                </a>
                <a href="#" class="social-icon">
                    <img src="icons/twitter.png" alt="Twitter">
                </a>
                <a href="#" class="social-icon">
                    <img src="icons/spotify.png" alt="Spotify">
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
